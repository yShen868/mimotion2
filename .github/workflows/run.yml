name: 修改微信步数

on:
  workflow_dispatch:
  schedule:
    # GitHub cron 使用 UTC。北京时间 = UTC+8。
    # 每天北京时间 15:07、15:32、15:48 各触发一次。
    # 当天成功后写入 schedule_state.json，后续自动触发直接跳过。
    - cron: "7,32,48 7 * * *"

# 同一时间只跑一个。后启动的任务会等前一个结束，再读取最新的今日记录。
concurrency:
  group: daily-mimotion-step
  cancel-in-progress: false

jobs:
  ChangBuShu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: pip3 install requests pytz pycryptodome

      - name: 今天已执行则跳过
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 schedule_state.py check

      - name: 修改步数
        if: steps.guard.outputs.skip != 'true'
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          FEISHU_RECEIVE_ID_TYPE: ${{ secrets.FEISHU_RECEIVE_ID_TYPE }}
        run: python3 main.py

      - name: 记录今天已执行
        if: steps.guard.outputs.skip != 'true' && success()
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 schedule_state.py mark

      - name: 保存 token 和今日记录
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          if [ -f token_store.json ]; then
            git add token_store.json
          fi
          if [ -f schedule_state.json ]; then
            git add schedule_state.json
          fi
          if git diff --cached --quiet; then
            echo "没有需要提交的记录"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: 保存登录 token 与今日执行记录"
            git push
          fi
